  html,body{margin:0;height:100%;background:#05070d;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}

<div class="tc" id="tl"><button id="bl">◀</button><button id="bd">▼</button><button id="br">▶</button></div>

<script>
(()=>{
const VW=960, VH=544, T=32, H=17, MAXW=240;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const dark=document.createElement('canvas'), dctx=dark.getContext('2d');
let S=1;
function resize(){
  const sc=Math.min(innerWidth/VW, innerHeight/VH);
  const dpr=window.devicePixelRatio||1;
  cv.style.width=(VW*sc)+'px'; cv.style.height=(VH*sc)+'px';
  S=sc*dpr;
  cv.width=dark.width=Math.round(VW*S); cv.height=dark.height=Math.round(VH*S);
}
addEventListener('resize',resize); resize();
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
const FONT="'Press Start 2P', monospace";

/* ---------- GUARDADO ---------- */
const SAVE_KEY='nanobot_save_v1';
let save={unlocked:1,best:{}};
try{const r=localStorage.getItem(SAVE_KEY);if(r)save=Object.assign(save,JSON.parse(r));}catch(e){}
let saveOk=true;
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));saveOk=true;}catch(e){saveOk=false;}}

/* ---------- DATOS DE NIVELES ---------- */
const BUGINFO={
  syntax:{label:'SyntaxError',msg:'Salta encima para corregirlo'},
  goto:{label:'GOTO',msg:'Bug saltarín: brinca sin avisar'},
  n404:{label:'404 Not Found',msg:'Bug volador: písalo desde arriba'},
  glitch:{label:'Glitch',msg:'Se teletransporta: mira dónde reaparece'},
  fork:{label:'ForkBomb',msg:'No hace daño, pero al pisarlo se divide. ¡Los pequeños sí!'},
  mini:{label:'fork()',msg:''},
  carrier:{label:'¡Bug con premio!',msg:'Lleva una pieza: písalo para soltarla'},
  kernel:{label:'KERNEL PANIC',msg:'¡JEFE! Písalo 3 veces'}
};
const THEMES=[
  {bg:['#0a1224','#101b33'],tile:'#0b4f36',top:'#19a06c',trace:'rgba(212,175,55,.55)'},
  {bg:['#160e20','#26162f'],tile:'#3b2a14',top:'#c98a2b',trace:'rgba(255,220,150,.35)'},
  {bg:['#06142a','#123a5c'],tile:'#2b3440',top:'#8796a8',trace:'rgba(200,220,255,.25)',stars:true},
  {bg:['#030f08','#08241a'],tile:'#0f2633',top:'#00c8e0',trace:'rgba(0,229,255,.45)',rain:true},
  {bg:['#170404','#2c0909'],tile:'#3a1010',top:'#ff5c3a',trace:'rgba(255,140,90,.45)'}
];
const LEVELS=[
 {name:'El Taller',bug:'syntax',item:'servo',c:['start','tuto','flat10b1','pit2','flat8b1','item','wall3','cp','flat10b1','stairs','pit2','cp','plats','flat8b1','wall3','flat10b1','cp','goalhi1']},
 {name:'Almacén a oscuras',bug:'syntax',item:'led',c:['start','flat8b1','pit2','item','cp','dark24','cp','flat10b2','plats','wall3','climb','platpit','flat8b1','flat10b1','plats','cp','goalhi2']},
 {name:'Cajón de componentes',bug:'goto',item:'sensor',c:['start','flat10b1','item','hidden14','cp','flat10b1','pit3','dark20','cp','plats','stairs','flat10b2','flat10b1','plats','pit3','flat17b1','cp','goalhi1']},
 {name:'Banco de soldadura',bug:'goto',item:'esp',c:['start','flat8b1','item','wall5','cp','flat10b2','hidden12','pit3','cp','plats','platpit','climb','dark20','wall5','flat8b1','flat10b1','plats','pit3','platpit','cp','goalhi2']},
 {name:'La azotea LoRa',bug:'n404',c:['start','flat12b1','pit3','cp','flat12b2','spikes','wall3','cp','plats','dark20','platpit','flat10b2','flat10b1','plats','pit3','platpit','stairs','plats','flat20b1','cp','goalhi1']},
 {name:'Torre de antenas',bug:'n404',c:['start','flat12b2','hidden12','cp','platpit','flat10b2','wall5','cp','plats','climb','dark24','plats','flat10b2','flat10b1','plats','pit3','platpit','stairs','flat12b2','flat8b1','cp','goalhi2']},
 {name:'Servidor corrupto',bug:'glitch',c:['start','flat10b1','stairs','cp','flat12b2','spikes','pit3','cp','plats','hidden14','climb','flat10b2','flat10b1','plats','pit3','platpit','stairs','flat12b2','plats','plats','flat23b1','cp','goalhi1']},
 {name:'Red de nodos',bug:'glitch',c:['start','flat12b2','dark24','cp','platpit','flat12b2','wall5','cp','plats','climb','hidden14','plats','spikes','flat12b3','flat10b1','plats','pit3','platpit','stairs','flat12b2','plats','climb','cp','goalhi2']},
 {name:'Fábrica de forks',bug:'fork',c:['start','flat10b1','pit3','cp','flat12b2','wall5','hidden12','cp','plats','climb','dark22','platpit','flat12b2','flat10b1','plats','pit3','platpit','stairs','flat12b2','plats','climb','spikes','flat13b1','plats','cp','goalhi1']},
 {name:'KERNEL PANIC',bug:'fork',boss:true,c:['start','flat10b1','stairs','cp','flat12b2','plats','pit3','cp','flat10b1','plats','pit3','platpit','stairs','flat12b2','plats','climb','spikes','flat10b2','plats','flat16b2','platpit','stairs','flat17b1','arena','goalhi1']}
];
const ITEMINFO={servo:{name:'SERVO',msg:'¡Saltas mucho más alto!'},led:{name:'LED',msg:'¡Ahora iluminas la oscuridad!'},
  sensor:{name:'SENSOR',msg:'¡Detectas trampas invisibles!'},esp:{name:'ESP32',msg:'¡Doble salto activado!'}};
const ITEM_LV={servo:1,led:2,sensor:3,esp:4};

/* ---------- ESTADO ---------- */
let splats=[],debris=[],shocks=[],slow=0,stains=[],projs=[],medal=null,confetti=[],arenaEntry=-1,map=[],W=0,items,screws,bugs,cps,signs,darks,goal,boss,gateCol,p,parts=[],pops=[],msg=null;
let gotOhm=0,resMet=false,state='title',sel=0,lvl=0,camX=0,time=0,levelTime=0,deaths=0,got=0,fixed=0,bugTotal=0,flash=0,met={},shake=0;

function buildLevel(i){
  const L=LEVELS[i];
  map=[];for(let y=0;y<H;y++)map.push(Array(MAXW).fill('.'));
  items=[];screws=[];bugs=[];cps=[];signs=[];darks=[];stains=[];boss=null;gateCol=-1;projs=[];medal=null;arenaEntry=-1;debris=[];shocks=[];slow=0;
  let x=0;
  const fillT=(x0,x1,y0,y1,c)=>{for(let y=y0;y<=y1;y++)for(let xx=x0;xx<=x1;xx++)map[y][xx]=c;};
  const ground=n=>{fillT(x,x+n-1,14,16,'#');x+=n;};
  const scr=(tx,ty)=>{const v=RVALS[Math.floor(Math.random()*RVALS.length)];screws.push({x:tx*T+16,y:ty*T+16,taken:false,val:v,bands:resBands(v),rot:(Math.random()-.5)*.6});};
  const addBug=(tx,type)=>{
    if(type==='n404')bugs.push(mkBug('n404',tx*T+4,10*T+8));
    else bugs.push(mkBug(type,tx*T+4,14*T-16));
  };
  for(const c of L.c){
    if(c==='start'){ground(8);cps.push({x:2*T,on:true});scr(5,12);scr(6,12);}
    else if(c==='tuto'){signs.push([x-5,'← → mover · SALTO: espacio / Z / botón A']);}
    else if(c.startsWith('flat')){const m=c.match(/flat(\d+)b(\d+)/);const n=+m[1],k=+m[2];const x0=x;ground(n);
      for(let j=0;j<k;j++)addBug(x0+Math.round(4+(n-6)*(k===1?0.5:j/(k-1))),L.bug);
      for(let j=2;j<n-1;j+=3)scr(x0+j,j%2?11:12);}
    else if(c.startsWith('pit')){const n=+c.slice(3);ground(3);const g0=x;x+=n;ground(3);
      for(let j=0;j<n;j++)scr(g0+j,n>2&&j===1?9:10);
      if(L.bug==='n404'&&n>=3)bugs.push(mkBug('n404',(g0+1)*T,8*T+8));}
    else if(c==='item'){const x0=x;ground(9);const cb=mkBug('carrier',(x0+5)*T+3,14*T-18);cb.item=L.item;cb.home=(x0+4)*T;bugs.push(cb);
      signs.push([x0,'¡Un bug lleva una pieza sorpresa!']);}
    else if(c==='wall3'||c==='wall5'){const h=c==='wall3'?3:5;ground(4);fillT(x,x+1,14-h,13,'#');scr(x,13-h-1);scr(x+1,13-h-1);ground(2);ground(4);}
    else if(c==='cp'){ground(4);cps.push({x:(x-2)*T,on:false});}
    else if(c==='stairs'){const x0=x;ground(12);fillT(x0+2,x0+3,13,13,'#');fillT(x0+4,x0+5,12,13,'#');fillT(x0+6,x0+7,11,13,'#');fillT(x0+8,x0+9,12,13,'#');
      scr(x0+4,10);scr(x0+6,9);scr(x0+7,9);scr(x0+8,10);}
    else if(c==='platpit'){ground(2);const g0=x;x+=7;ground(2);fillT(g0+2,g0+4,12,12,'#');scr(g0+3,10);scr(g0+2,10);scr(g0+4,10);}
    else if(c.startsWith('dark')){const n=+c.slice(4);const x0=x;ground(n);darks.push([(x0+1)*T,(x0+n-1)*T]);
      signs.push([x0-6,'⚠ ZONA OSCURA']);
      const a=x0+Math.floor(n*0.3),b=x0+Math.floor(n*0.65);fillT(a,a+1,14,16,'.');fillT(b,b+1,12,13,'#');
      scr(a,10);scr(a+1,10);scr(b,10);scr(x0+n-3,12);
      if(L.bug!=='n404')addBug(x0+Math.floor(n*0.45),L.bug);else bugs.push(mkBug('n404',(x0+Math.floor(n*0.8))*T,10*T+8));}
    else if(c.startsWith('hidden')){const n=+c.slice(6);const x0=x;ground(n);[3,4,8,11,12].filter(o=>o<n-2).forEach(o=>map[13][x0+o]='x');
      scr(x0+3,10);scr(x0+4,10);scr(x0+8,10);if(i===2)signs.push([x0-2,'¿Trampas invisibles? El SENSOR las ve']);}
    else if(c==='spikes'){ground(3);const s0=x;ground(2);map[13][s0]='^';map[13][s0+1]='^';ground(3);scr(s0,10);scr(s0+1,10);}
    else if(c==='arena'){const x0=x;ground(4);const a0=x;ground(30);fillT(a0+6,a0+8,11,11,'#');fillT(a0+21,a0+23,11,11,'#');
      gateCol=x;fillT(x,x,0,13,'W');ground(1);
      arenaEntry=a0;boss=mkBug('kernel',(a0+18)*T,14*T-46);boss.spawnX=boss.x;boss.minX=a0*T;boss.maxX=(a0+30)*T;bugs.push(boss);
      signs.push([x0-2,'⚠ PELIGRO: KERNEL PANIC']);}
    else if(c==='plats'){ground(2);const g0=x;x+=12;ground(2);
      for(const [a,r] of [[1,12],[5,11],[9,12]]){fillT(g0+a,g0+a+1,r,r,'#');scr(g0+a,r-2);scr(g0+a+1,r-2);}
      if(L.bug==='n404')bugs.push(mkBug('n404',(g0+6)*T,8*T+8));}
    else if(c==='climb'){const x0=x;ground(16);
      fillT(x0+3,x0+5,12,12,'#');fillT(x0+6,x0+8,10,10,'#');fillT(x0+9,x0+11,8,8,'#');fillT(x0+12,x0+13,7,13,'#');
      scr(x0+4,10);scr(x0+7,8);scr(x0+10,6);scr(x0+12,5);scr(x0+13,5);
      if(L.bug!=='n404')addBug(x0+1,L.bug);}
    else if(c==='goalhi1'||c==='goalhi2'){const hard=c==='goalhi2';ground(3);const g0=x;
      const steps=hard?[[1,12],[4,10],[8,8]]:[[1,12],[5,10]];const pit=hard?12:9,top=hard?6:8;x+=pit;
      for(const [a,r] of steps){fillT(g0+a,g0+a+1,r,r,'#');scr(g0+a,r-2);}
      fillT(g0+pit,g0+pit+9,top,16,'#');x=g0+pit+10;
      goal={x:(g0+pit+5)*T,y:top*T-64};
      if(hard){if(L.bug==='n404')bugs.push(mkBug('n404',(g0+pit+2)*T,(top-3)*T+8));else{const b=mkBug(L.bug,(g0+pit+2)*T+4,top*T-16);bugs.push(b);}}
      signs.push([g0-2,'¡La SALIDA está arriba!']);}
    else if(c.startsWith('tunnel')){const n=+c.slice(6)||10;const x0=x;ground(n+5);fillT(x0+3,x0+2+n,3,12,'#');
      for(let j=1;j<n;j+=2)scr(x0+3+j,13);signs.push([x0-4,'¡Túnel! Agáchate: ↓ / S / ▼']);
      if(n>=10){const tb={syntax:'syntax',goto:'syntax',n404:'syntax',glitch:'glitch',fork:'fork'}[L.bug]||'syntax';addBug(x0+3+Math.floor(n*.6),tb);}}
    else if(c==='goal'){const x0=x;ground(12);goal={x:(x0+6)*T,y:12*T};}
  }
  W=x+1;fillT(0,0,0,13,'#');fillT(W-1,W-1,0,16,'#');
  bugTotal=bugs.length;
}
function mkBug(type,x,y){
  const b={type,x,y,w:24,h:16,vx:0,vy:0,dir:-1,alive:true,sq:0,t:Math.random()*5,ground:false,ox:x,oy:y,phase:'on',pt:2+Math.random()};
  if(type==='mini'){b.w=16;b.h=11;}
  if(type==='carrier'){b.w=26;b.h=18;}
  if(type==='kernel'){b.w=64;b.h=46;b.hp=3;b.inv=0;b.jt=2.5;b.mode='sleep';b.mt=0;b.at=2;b.boom=0;}
  if(type==='goto')b.jt=1+Math.random();
  return b;
}
function startLevel(i){
  lvl=i;buildLevel(i);
  const a=k=>i+1>ITEM_LV[k];
  p={x:2*T+5,y:14*T-34,w:22,h:34,vx:0,vy:0,ground:false,face:1,coyote:0,buf:0,jumps:0,
     servo:a('servo'),led:a('led'),sensor:a('sensor'),esp:a('esp'),cp:0,inv:0,
     sY:1,ant:0,antV:0,run:0,idle:0,expr:'normal',exprT:0,blinkT:0,thr:0,dust:0,kb:0,dying:0,spawn:0,crouch:false,ck:0};
  parts=[];pops=[];met={};deaths=0;got=0;gotOhm=0;resMet=false;fixed=0;camX=0;levelTime=0;
  msg={t:'NIVEL '+(i+1),s:LEVELS[i].name,life:2.6};
  state='play';
}
function setExpr(e,t){p.expr=e;p.exprT=t;}

/* ---------- ENTRADA ---------- */
const keys={}; let tL=false,tR=false,tJ=false,prev={};
addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();initAudio();});
addEventListener('keyup',e=>{keys[e.code]=false;});
const touch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(touch){document.getElementById('tl').style.display='block';document.getElementById('tr').style.display='block';}
function hold(id,set){const b=document.getElementById(id);
  const on=e=>{e.preventDefault();set(true);b.classList.add('on');initAudio();};
  const off=e=>{e.preventDefault();set(false);b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('pointerleave',off);}
let tD=false;hold('bl',v=>tL=v);hold('br',v=>tR=v);hold('bj',v=>tJ=v);hold('bd',v=>tD=v);
let tapQ=null;
cv.addEventListener('pointerdown',e=>{initAudio();const r=cv.getBoundingClientRect();tapQ={x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH};});
document.getElementById('fs').addEventListener('click',()=>{try{const el=document.documentElement;const f=el.requestFullscreen||el.webkitRequestFullscreen;const r=f&&f.call(el);r&&r.catch&&r.catch(()=>{});}catch(e){}});
document.getElementById('mn').addEventListener('click',()=>{if(state==='cut'){while(cut)cutNext();return;}toMenu();});
function toMenu(){state='title';sel=Math.min(save.unlocked-1,lvl);msg=null;}
function readInput(){
  let l=keys.ArrowLeft||keys.KeyA||tL, r=keys.ArrowRight||keys.KeyD||tR, j=keys.Space||keys.KeyZ||keys.ArrowUp||keys.KeyW||tJ,
      u=keys.ArrowUp||keys.KeyW, d=keys.ArrowDown||keys.KeyS||tD, esc=keys.Escape, a=keys.Space||keys.KeyZ||keys.Enter||tJ;
  try{for(const g of navigator.getGamepads?navigator.getGamepads():[]){ if(!g)continue;
    const ax=g.axes[0]||0, ay=g.axes[1]||0;
    if(ax<-0.35||g.buttons[14]?.pressed)l=true; if(ax>0.35||g.buttons[15]?.pressed)r=true;
    if(ay<-0.5||g.buttons[12]?.pressed)u=true; if(ay>0.5||g.buttons[13]?.pressed)d=true;
    if(g.buttons[0]?.pressed||g.buttons[1]?.pressed){j=true;a=true;} if(g.buttons[9]?.pressed||g.buttons[8]?.pressed)esc=true;}}catch(e){}
  const cur={l,r,j,u,d,esc,a};const out={...cur};
  for(const k in cur)out[k+'p']=cur[k]&&!prev[k];
  prev=cur;return out;
}

/* ---------- SONIDO ---------- */
let ac=null;
function initAudio(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  if(!ac.__ok){const b=ac.createBuffer(1,1,22050),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);ac.__ok=1;}}catch(e){}}
['pointerup','touchend','click','mousedown','keyup'].forEach(ev=>addEventListener(ev,initAudio,{capture:true,passive:true}));
function beep(f,d,type='square',v=0.06,slide=0){try{if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v*.6,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d);}catch(e){}}
const sfx={jump:()=>beep(330,.15,'square',.05,660),dj:()=>beep(520,.15,'square',.05,1040),
  screw:()=>{beep(988,.07,'square',.04);setTimeout(()=>beep(1319,.1,'square',.04),60);},
  power:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15,'triangle',.07),i*90)),
  hurt:()=>beep(300,.35,'sawtooth',.06,60),stomp:()=>beep(200,.12,'square',.06,90),
  cp:()=>[660,880].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle',.06),i*80)),
  win:()=>[523,659,784,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,'triangle',.07),i*130))};




/* ---------- RESISTENCIAS ---------- */
const RVALS=[100,220,330,470,1000,2200,4700,10000,22000,47000,100000];
const BANDC=['#111111','#7a4a1e','#d42a2a','#ff8a1e','#ffd21e','#2eb84a','#2563eb','#8a3fe0','#8a8f98','#f2f2f2'];

const solid=(tx,ty)=>{if(tx<0||tx>=W)return true;if(ty<0||ty>=H)return false;const c=map[ty][tx];return c==='#'||c==='W';};

function moveEnt(e,dt){
  let hitX=false;e.x+=e.vx*dt;
  let t0=Math.floor(e.y/T),t1=Math.floor((e.y+e.h-1)/T);
  if(e.vx>0){const tx=Math.floor((e.x+e.w)/T);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){e.x=tx*T-e.w-0.01;hitX=true;break;}}
  else if(e.vx<0){const tx=Math.floor(e.x/T);for(let ty=t0;ty<=t1;ty++)if(solid(tx,ty)){e.x=(tx+1)*T;hitX=true;break;}}
  e.y+=e.vy*dt;e.ground=false;
  t0=Math.floor(e.x/T);t1=Math.floor((e.x+e.w-1)/T);
  if(e.vy>0){const ty=Math.floor((e.y+e.h)/T);for(let tx=t0;tx<=t1;tx++)if(solid(tx,ty)){e.y=ty*T-e.h;e.vy=0;e.ground=true;break;}}
  else if(e.vy<0){const ty=Math.floor(e.y/T);for(let tx=t0;tx<=t1;tx++)if(solid(tx,ty)){e.y=(ty+1)*T;e.vy=0;break;}}

function updateBoss(b,dt){
  b.t+=dt;b.inv=Math.max(0,b.inv-dt);
  const toP=p.x+11<b.x+b.w/2?-1:1;
  const spd=70+(3-b.hp)*30;
  switch(b.mode){
    case 'sleep':b.vx=0;b.hp=b.hp;
      if(p.x>(arenaEntry+3)*T&&p.x<b.maxX){b.mode='intro';b.mt=1.8;b.dir=toP;shake=.7;roar();
        for(let y=0;y<14;y++)map[y][arenaEntry]='W';
        msg={t:'¡JEFE FINAL: KERNEL PANIC!',s:'Písalo 3 veces · ¡Cuidado con sus ataques!',life:3.4,red:true};}
      break;
    case 'intro':b.vx=0;b.dir=toP;b.mt-=dt;if(b.mt<=0){b.mode='walk';b.at=1.6;}break;
    case 'walk':
      if(b.x<b.minX+8)b.dir=1;if(b.x+b.w>b.maxX-8)b.dir=-1;b.vx=b.dir*spd;b.at-=dt;
      if(b.at<=0&&b.ground){const ops=['jump'];if(b.hp<=2)ops.push('charge','charge');if(b.hp<=1)ops.push('shoot','shoot');
        const o=ops[Math.floor(Math.random()*ops.length)];
        if(o==='jump'){b.vy=-640;b.at=1.6+Math.random();}
        else if(o==='charge'){b.mode='windup';b.mt=.8;b.dir=toP;b.vx=0;beep(220,.5,'square',.05,440);}
        else{b.mode='shoot';b.mt=.7;b.fired=false;b.dir=toP;b.vx=0;}}
      break;
    case 'windup':b.vx=0;b.mt-=dt;if(b.mt<=0){b.mode='charge';roar();}break;
    case 'charge':b.vx=b.dir*440;
      if((b.dir<0&&b.x<b.minX+6)||(b.dir>0&&b.x+b.w>b.maxX-6)){b.mode='stun';b.mt=1.3;b.vx=0;shake=.4;beep(70,.3,'triangle',.1,40);burst(b.x+(b.dir>0?b.w:0),b.y+20,'#ffd27a',16);}
      break;
    case 'stun':b.vx=0;b.mt-=dt;if(b.mt<=0){b.mode='walk';b.at=1.4+Math.random();}break;
    case 'shoot':b.vx=0;b.mt-=dt;
      if(!b.fired&&b.mt<.35){b.fired=true;const hx=b.x+b.w/2+b.dir*28,hy=b.y+10;
        for(const k of [-1,0,1]){const dx=p.x+11-hx;projs.push({x:hx,y:hy,vx:Math.max(-380,Math.min(380,dx*0.85+k*110)),vy:-520-Math.abs(k)*40,life:3,r:0});}
        beep(600,.2,'square',.05,200);}
      if(b.mt<=0){b.mode='walk';b.at=2;}
      break;
    case 'dying':{b.vx=0;b.mt+=dt;shake=Math.max(shake,.12+b.mt*.05);b.boom-=dt;const cx=b.x+b.w/2,cy=b.y+b.h/2;
      b.crack=Math.min(1,b.mt/1.6);b.glow=b.mt>2.4?Math.min(1,(b.mt-2.4)/.8):0;
      if(b.boom<=0&&b.mt<3.2){b.boom=b.mt<1.6?.16:.09;const ex=b.x+Math.random()*b.w,ey=b.y+Math.random()*b.h;
        burst(ex,ey,['#ff5c3a','#ffd27a','#ffffff','#7ff6ff'][Math.floor(Math.random()*4)],10);beep(60+Math.random()*160,.12,'sawtooth',.05,30);
        if(Math.random()<.45)pops.push({x:ex,y:ey-10,t:ERRS[Math.floor(Math.random()*ERRS.length)],life:1,col:'#ff5c77'});}
      if(b.stage===0&&b.mt>1.6){b.stage=1;shake=.5;beep(140,.5,'square',.08,40);
        for(let i=0;i<6;i++){const s=i<3?-1:1;debris.push({kind:'leg',x:cx+s*(10+i%3*10),y:b.y+b.h-8,vx:s*(120+Math.random()*160),vy:-260-Math.random()*200,rot:0,vr:(Math.random()-.5)*14,size:1});}}
      if(b.stage===1&&b.mt>2.4){b.stage=2;shake=.6;flash=.2;beep(900,.3,'triangle',.06,200);
        debris.push({kind:'crown',x:cx+20*b.dir,y:b.y-6,vx:b.dir*90,vy:-420,rot:0,vr:8,size:1});
        for(let i=0;i<6;i++)debris.push({kind:'shard',x:cx-8+Math.random()*16,y:b.y+6,vx:(Math.random()-.5)*300,vy:-200-Math.random()*250,rot:Math.random()*6,vr:(Math.random()-.5)*20,size:.6+Math.random()*.6});}
      if(b.stage===2&&b.mt>3.2){b.stage=3;b.mode='dead';shake=1;flash=.7;slow=.5;sfx.win();beep(50,1.2,'sawtooth',.1,25);addStain(b);
        shocks.push({x:cx,y:b.y+b.h-6,r:0,life:.9});shocks.push({x:cx,y:cy,r:0,life:.6,inner:true});
        burst(cx,cy,'#ffd27a',80);burst(cx,cy,'#ff5c3a',60);burst(cx,cy,'#7ff6ff',40);
        for(let i=0;i<24;i++)pops.push({x:cx+(Math.random()-.5)*80,y:cy+(Math.random()-.5)*40,t:['0','1','ERR','NULL','0x0','{}'][i%6],life:.8+Math.random()*.8,col:i%2?'#ff5c77':'#4dff9a'});
        debris.push({kind:'shell',x:cx-10,y:cy,vx:-180,vy:-380,rot:0,vr:-5,size:1});debris.push({kind:'shell',x:cx+10,y:cy,vx:200,vy:-340,rot:0,vr:6,size:1,flip:true});
        debris.push({kind:'head',x:cx+28*b.dir,y:cy,vx:b.dir*160,vy:-300,rot:0,vr:7,size:1});
        for(let i=0;i<8;i++)debris.push({kind:'chunk',x:cx+(Math.random()-.5)*40,y:cy,vx:(Math.random()-.5)*420,vy:-150-Math.random()*380,rot:Math.random()*6,vr:(Math.random()-.5)*16,size:.5+Math.random()*.7});
        for(let y=0;y<14;y++)for(let x=0;x<W;x++)if(map[y][x]==='W')map[y][x]='.';
        medal={x:cx,y:b.y-60,vy:-300,t:0,taken:false};
        pops.push({x:cx,y:b.y-30,t:'✓ KERNEL CORREGIDO',life:2.5});
        msg={t:'¡KERNEL PANIC DERROTADO!',s:'Recoge tu medalla y ve a la salida',life:4};}
      break;}
    case 'dead':b.vx=0;break;
  }
  b.vy=Math.min(b.vy+G*dt,900);
  const hitX=moveEnt(b,dt);
  if(hitX&&b.mode==='walk')b.dir*=-1;
  if(hitX&&b.mode==='charge'){b.mode='stun';b.mt=1.3;shake=.4;}
  if(b.ground&&b.wasAir&&b.mode!=='dying'){shake=.22;beep(80,.15,'triangle',.08,40);burst(b.x+b.w/2,b.y+b.h,'rgba(200,200,210,.7)',10);}
  b.wasAir=!b.ground;
  if(b.hp<=1&&ACTIVE.includes(b.mode)&&Math.random()<dt*8)parts.push({x:b.x+20+Math.random()*24,y:b.y+4,vx:(Math.random()-.5)*20,vy:-40,life:.9,col:'rgba(90,90,100,.55)',g:-20});
  if(ACTIVE.includes(b.mode)&&b.mode!=='intro'&&overlap(p,b)){
    if(p.vy>0&&p.y+p.h-b.y<28){p.vy=keysJump()?-620:-500;p.sY=1.25;setExpr('happy',.7);sfx.stomp();if(b.inv<=0)bossHit(b);}
    else if(b.inv<=0)die();
  }
}

function drawTiles(){
  const th=TH();const x0=Math.max(0,Math.floor(camX/T)),x1=Math.min(W-1,x0+Math.ceil(VW/T)+1);
  for(let y=0;y<H;y++)for(let x=x0;x<=x1;x++){const c=map[y][x],sx=x*T-camX,sy=y*T;

function faceOf(){

function drawFace(c,face,f,look){
  c.fillStyle='#00e5ff';c.strokeStyle='#00e5ff';c.lineWidth=2;c.lineCap='round';
  c.shadowColor='#00e5ff';c.shadowBlur=6;
  const L=-5+look,R=5+look,Y=-33;
  if(face==='normal'){const bl=(p.blinkT%3.4)<0.12;const eh=bl?1:6;
    rr(c,L-2,Y-eh/2,4,eh,1.5);c.fill();rr(c,R-2,Y-eh/2,4,eh,1.5);c.fill();}
  else if(face==='happy'){for(const x of [L,R]){c.beginPath();c.arc(x,Y+1.5,3,Math.PI*1.1,Math.PI*1.9);c.stroke();}
    c.beginPath();c.arc(look,Y+2.5,3,0.2,Math.PI-0.2);c.stroke();}
  else if(face==='scared'){for(const x of [L,R]){c.beginPath();c.arc(x,Y-1,2.6,0,7);c.stroke();}
    c.beginPath();c.arc(look,Y+4.5,1.6,0,7);c.fill();}
  else if(face==='focus'){c.fillRect(L-2.5,Y-1,5,3);c.fillRect(R-2.5,Y-1,5,3);
    c.beginPath();c.moveTo(L-3,Y-3.5+f);c.lineTo(L+3,Y-2.5-f);c.moveTo(R-3,Y-2.5+f);c.lineTo(R+3,Y-3.5-f);c.stroke();}
  else if(face==='dizzy'){for(const x of [L,R]){c.beginPath();c.moveTo(x-2.5,Y-2.5);c.lineTo(x+2.5,Y+2.5);c.moveTo(x+2.5,Y-2.5);c.lineTo(x-2.5,Y+2.5);c.stroke();}
    c.beginPath();c.moveTo(look-3,Y+4.5);for(let i=0;i<4;i++)c.lineTo(look-3+i*2+1,Y+4.5+(i%2?-1:1));c.stroke();}
  else if(face==='sleep'){c.beginPath();c.moveTo(L-2.5,Y);c.lineTo(L+2.5,Y);c.moveTo(R-2.5,Y);c.lineTo(R+2.5,Y);c.stroke();}
  else if(face==='wave'){rr(c,L-2,Y-3,4,6,1.5);c.fill();c.beginPath();c.arc(R,Y+1.5,3,Math.PI*1.1,Math.PI*1.9);c.stroke();
    c.beginPath();c.arc(look,Y+2.5,3,0.2,Math.PI-0.2);c.stroke();}
  c.shadowBlur=0;
}

  for(let i=0;i<n;i++){ctx.fillStyle='rgba(255,40,70,.55)';ctx.fillRect(x,y+8+((i*5)%11)*14-2,w,9);ctx.fillStyle='#ff5c77';ctx.font='6px '+FONT;ctx.textAlign='right';ctx.fillText('⚠ warning',x+w-6,y+14+((i*5)%11)*14);}ctx.restore();}

  for(let i=1;i<10;i++){const k=i/10;ctx.lineTo(x1+(x2-x1)*k+(hsh(seed+i)-.5)*40,y1+(y2-y1)*k+(hsh(seed+i+50)-.5)*30);}ctx.lineTo(x2,y2);ctx.stroke();ctx.shadowBlur=0;}
function firework(x,y,tt,col,seed){if(tt<0||tt>1.4)return;ctx.globalAlpha=Math.max(0,1-tt/1.4);ctx.fillStyle=col;
  for(let i=0;i<28;i++){const a=i/28*Math.PI*2,r=tt*130*(0.8+hsh(seed+i)*.4);ctx.beginPath();ctx.arc(x+Math.cos(a)*r,y+Math.sin(a)*r+tt*tt*40,3*(1-tt/1.6),0,7);ctx.fill();}ctx.globalAlpha=1;}
function rays(cx,cy,t,col,a){ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.3);ctx.fillStyle=col;ctx.globalAlpha=a;for(let i=0;i<12;i++){ctx.rotate(Math.PI/6);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(700,-60);ctx.lineTo(700,60);ctx.fill();}ctx.restore();ctx.globalAlpha=1;}
